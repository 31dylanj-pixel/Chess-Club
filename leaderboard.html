<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Leaderboard - Chess Club</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="container">

        <h1>🏆 Leaderboard</h1>

        <p class="tagline">
            See how Chess Club members rank against each other.
        </p>

        <a href="index.html" class="back-btn">
            Back to Home
        </a>

        <div class="season-label">

            September

        </div>
    

        <!-- TOP 3 -->

        <section class="podium">


            <!-- SECOND PLACE -->

            <div class="podium-card second-place">

                <div class="podium-rank">
                    🥈
                </div>

                <h2>Coming Soon</h2>

                <p class="podium-points">
                    -- Points
                </p>

            </div>


            <!-- FIRST PLACE -->

            <div class="podium-card first-place">

                <div class="podium-rank">
                    🥇
                </div>

                <h2>Coming Soon</h2>

                <p class="podium-points">
                    -- Points
                </p>

                <span class="leader-label">
                    CURRENT LEADER
                </span>

            </div>


            <!-- THIRD PLACE -->

            <div class="podium-card third-place">

                <div class="podium-rank">
                    🥉
                </div>

                <h2>Coming Soon</h2>

                <p class="podium-points">
                    -- Points
                </p>

            </div>


        </section>


        <!-- FULL RANKINGS -->

        <section class="rankings-section">

            <h2>All Rankings</h2>


            <div class="rankings-table">


                <!-- HEADER -->

                <div class="ranking-header">
                    Rank
                </div>

                <div class="ranking-header">
                    Player
                </div>

                <div class="ranking-header">
                    Points
                </div>


                <!-- PLACEHOLDER -->

                <div class="ranking-row-rank">
                    --
                </div>

                <div class="ranking-row-player">
                    Rankings Coming Soon
                </div>

                <div class="ranking-row-points">
                    --
                </div>


            </div>

        </section>

    </main>

</body>

</html>
