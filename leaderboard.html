    </a>

    <button
        class="topbar-toggle"
        id="topbarToggle"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="topbarNav"
    >
        <span></span><span></span><span></span>
    </button>

    <nav class="topbar-nav" id="topbarNav" aria-label="Main navigation">
        <a href="index.html" class="topbar-link"><span class="topbar-icon">🏠</span><span>Home</span></a>
        <a href="leaderboard.html" class="topbar-link"><span class="topbar-icon">🏆</span><span>Leaderboard</span></a>

        <a href="puzzle-winners.html" class="topbar-link"><span class="topbar-icon">🧩</span><span>Puzzle Winners</span></a>

    </nav>

</header>

<div class="topbar-overlay" id="topbarOverlay"></div>

    
    <main class="container">

        <h1>🏆 Leaderboard</h1>

        <p class="tagline">
            See how Chess Club members rank against each other.
        </p>

        <a href="index.html" class="back-btn">
            Back to Home
        </a>

        <div class="season-label">
            October 2026
        </div>
    

        <!-- TOP 3 -->

        <section class="podium">


            <!-- SECOND PLACE -->

            <div class="podium-card second-place">

                <div class="podium-rank">
                    🥈
                </div>

                <h2>None</h2>

                <p class="podium-points">
                    -- Points
                </p>

            </div>


            <!-- FIRST PLACE -->

            <div class="podium-card first-place">

                <div class="podium-rank">
                    🥇
                </div>

                <h2>None</h2>

                <p class="podium-points">
                    -- Points
                </p>

                <span class="leader-label">
                    CURRENT LEADER
                </span>

            </div>


            <!-- THIRD PLACE -->

            <div class="podium-card third-place">

                <div class="podium-rank">
                    🥉
                </div>

                <h2>None</h2>

                <p class="podium-points">
                    -- Points
                </p>

            </div>


        </section>


        <!-- FULL RANKINGS -->

        <section class="rankings-section">
            <h2>All Rankings</h2>
        
            <div class="rankings-table">
                <div class="ranking-header">Rank</div>
                <div class="ranking-header">Player</div>
                <div class="ranking-header">Points</div>
                <div class="ranking-header"></div>
            </div>
        </section>

    </main>

    <script src="leaderboard.js"></script>
    <script src="nav.js"></script>
    
</body>

</html>
